[generate_linux_entities_flat(3)]
args = num, server_role, my_index
definition = [| makeresults count=$num$ | streamstats count | eval count = substr("00", 0, max(2-len(count), 0)) . count | eval role = $server_role$ | eval server=role."_".count | eval ip="10.1.2.1".count | map search="| makeresults count=1 `linux_metrics_gen_cpu_stable` `linux_metrics_gen_memory_stable` `linux_metrics_gen_df_stable` `linux_metrics_gen_disk_stable` `linux_metrics_gen_network_stable` | eval process_name=system | eval os=Linux | eval os_version = '2.6.32-573.8.1.el6.x86_64' | eval entity_type='nix_host' | mcollect index=$my_index$ host=$server$ marker=\"os=Linux, os_version='2.6.32-573.8.1.el6.x86_64', entity_type='*nix', process_name='system' role=$role$, ip=$ip$|\""]
iseval = 0

[generate_linux_entities_unstable_flat(3)]
args = num, server_role, my_index
definition = [| makeresults count=$num$ | streamstats count | eval count = substr("00", 0, max(2-len(count), 0)) . count | eval role = $server_role$ | eval server=role."_".count | eval ip="10.1.2.1".count | map search="| makeresults count=1 `linux_metrics_gen_cpu_unstable` `linux_metrics_gen_memory_unstable` `linux_metrics_gen_df_unstable` `linux_metrics_gen_disk_stable` `linux_metrics_gen_network_stable` | eval process_name=system | eval os=Linux | eval os_version = '2.6.32-573.8.1.el6.x86_64' | eval entity_type='nix_host' | mcollect index=$my_index$ host=$server$ marker=\"os=Linux, os_version='2.6.32-573.8.1.el6.x86_64', entity_type='*nix', process_name='system', role=$role$, ip=$ip$|\""]
iseval = 0

[generate_windows_entities_flat(3)]
args = num, server_role, my_index
definition = [| makeresults count=$num$ | streamstats count | eval count = substr("00", 0, max(2-len(count), 0)) . count | eval role = $server_role$ | eval server=role."_".count | map search="| makeresults count=1 `windows_metrics_stable` | mcollect index=$my_index$ host=$server$ marker=\"entity_type='Windows', instance=_Total\""]
iseval = 0

# Lookup-driven Hi_ED DC 1 metrics (no map, no makeresults). Chained after inputlookup row fields.
[edu_dc1_apply_metrics]
definition = | eval metric_name:processmon.cpu.percent = case(profile="windows", null(), profile="unstable", if(minute>39 AND minute<60, random()%15+85, random()%25+40), true(), random()%25+40) \
| eval metric_name:cpu.interrupt = if(profile="windows", null(), random()%5000/100000) \
| eval metric_name:cpu.nice = if(profile="windows", null(), round(0,2)) \
| eval metric_name:cpu.softriq = if(profile="windows", null(), random()%5000/100000) \
| eval metric_name:cpu.steal = if(profile="windows", null(), round(0,2)) \
| eval metric_name:cpu.system = if(profile="windows", null(), 'metric_name:processmon.cpu.percent'*(1/10)) \
| eval metric_name:cpu.user = if(profile="windows", null(), 'metric_name:processmon.cpu.percent'*(9/10)) \
| eval metric_name:cpu.wait = if(profile="windows", null(), random()%5000/100000) \
| eval metric_name:cpu.idle = if(profile="windows", null(), 100-'metric_name:cpu.interrupt'-'metric_name:cpu.nice'-'metric_name:cpu.softriq'-'metric_name:cpu.steal'-'metric_name:cpu.system'-'metric_name:cpu.user'-'metric_name:cpu.wait') \
| eval metric_name:df.reserved = if(profile="windows", null(), random()%10) \
| eval metric_name:df.used = case(profile="windows", null(), profile="unstable", if(minute>37 AND minute<60, random()%10+90, abs((minute)+random()%10)/2), true(), random()%10+50) \
| eval metric_name:df.free = if(profile="windows", null(), 100-'metric_name:df.reserved'-'metric_name:df.used') \
| eval metric_name:disk.io_time.io_time = if(profile="windows", null(), random()%6000+2000) \
| eval metric_name:disk.io_time.weighted_io_time = if(profile="windows", null(), random()%21000+4000) \
| eval metric_name:disk.merged.read = if(profile="windows", null(), 0) \
| eval metric_name:disk.merged.write = if(profile="windows", null(), random()%100+40) \
| eval metric_name:disk.octets.read = if(profile="windows", null(), random()%1000+500) \
| eval metric_name:disk.octets.write = if(profile="windows", null(), random()%1000+500) \
| eval metric_name:disk.ops.read = if(profile="windows", null(), random()%50000/100+1800.00) \
| eval metric_name:disk.ops.write = if(profile="windows", null(), random()%50000/100+1800.00) \
| eval metric_name:disk.time.read = if(profile="windows", null(), (random()%400+400)/1000) \
| eval metric_name:disk.time.write = if(profile="windows", null(), (random()%1000+2000)/1000) \
| eval metric_name:memory.buffered = if(profile="windows", null(), random()%10/100000) \
| eval metric_name:memory.cached = if(profile="windows", null(), random()%10/100000) \
| eval metric_name:memory.slab_recl = if(profile="windows", null(), random()%500/100) \
| eval metric_name:memory.slab_unrecl = if(profile="windows", null(), round(0,2)) \
| eval metric_name:memory.used = case(profile="windows", null(), profile="unstable", if(minute>37 AND minute<60, random()%10+90, abs((minute)+random()%10)/2), true(), random()%10+50) \
| eval metric_name:memory.free = if(profile="windows", null(), 100-'metric_name:memory.used') \
| eval metric_name:interface.dropped.rx = if(profile="windows", null(), 0) \
| eval metric_name:interface.dropped.tx = if(profile="windows", null(), 0) \
| eval metric_name:interface.errors.rx = if(profile="windows", null(), 0) \
| eval metric_name:interface.errors.tx = if(profile="windows", null(), 0) \
| eval metric_name:interface.octets.rx = if(profile="windows", null(), random()%500000+500000) \
| eval metric_name:interface.octets.tx = if(profile="windows", null(), random()%1500000+1500000) \
| eval metric_name:interface.packets.rx = if(profile="windows", null(), random()%700000000/100+1) \
| eval metric_name:interface.packets.tx = if(profile="windows", null(), random()%200000000/100+1) \
| eval metric_name:Processor.%_Idle_Time = if(profile="windows", random()%25+40, null()) \
| eval metric_name:Memory.%_Committed_Bytes_In_Use = if(profile="windows", random()%10+60, null()) \
| eval metric_name:LogicalDisk.%_Free_Space = if(profile="windows", random()%10+50, null()) \
| eval metric_name:Avg._Disk_Bytes/Read = if(profile="windows", random()%50000/100+1800.00, null()) \
| eval metric_name:Avg._Disk_Bytes/Write = if(profile="windows", random()%50000/100+1800.00, null()) \
| eval metric_name:Network_Interface.Bytes_Received/sec = if(profile="windows", random()%700000000/100+1, null()) \
| eval metric_name:Network_Interface.Bytes_Sent/sec = if(profile="windows", random()%200000000/100+1, null())
iseval = 0
