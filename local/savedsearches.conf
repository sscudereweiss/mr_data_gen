# SA Lab prod reliability profile: demo-hours Mon-Fri 08:00-18:00, 5-min cadence.
# Overrides default/ */1 schedules without editing shipped stanzas.
#
# Hi_ED DC 1 primary path: scripted input [script://.../bin/edu_dc1_metrics_gen.py]
# in default/inputs.conf (enable in local/inputs.conf). When scripted input is active,
# disable this search to avoid duplicate metrics. SPL path is emergency fallback only.

[Hi_ED DC 1 Generator]
disabled = 1
cron_schedule = */5 8-18 * * 1-5
schedule_priority = default
search = | inputlookup edu_dc1_hosts where enabled=1 \
| eval _time=now() \
| eval minute=strftime(_time, "%M"), process_name=system, os_version="2.6.32-573.8.1.el6.x86_64", entity_type="nix_host" \
| eval entity_marker=if(profile="windows", "entity_type=Windows, instance=_Total", "os=Linux, os_version=".os_version.", entity_type=nix, process_name=system, role=".role.", ip=".ip) \
| map maxsearches=20 search="| makeresults count=1 | eval _time=$_time$ | eval minute=$minute$ | eval profile=$profile$ | eval role=$role$ | eval os_version=\"2.6.32-573.8.1.el6.x86_64\" | eval entity_type=\"nix_host\" | eval process_name=system `edu_dc1_apply_metrics` | mcollect index=itsi_im_metrics host=$host$ marker=\"$entity_marker$\""

[Hi_ED DC 2 Generator]
cron_schedule = */5 8-18 * * 1-5
schedule_priority = default

[SLG DC 1 Generator]
cron_schedule = */5 8-18 * * 1-5
schedule_priority = default

[SLG DC 2 Generator]
cron_schedule = */5 8-18 * * 1-5
schedule_priority = default

[SLG RUM Generator]
cron_schedule = */5 8-18 * * 1-5

[SLG APM Generator]
cron_schedule = */5 8-18 * * 1-5
search = | makeresults count=7 \
| streamstats count as stream \
| `apm_base(\"license_renewal\")` \
| eval sf_streamLabel=case(stream=1, "non_error_counts", stream=2, "error_counts", stream=3, "thruput_avg_rate", stream=4, "non_error_durations", stream=5, "error_durations", stream=6, "non_error_durations_p99", stream=7, "error_durations_p99") \
| eval sf_error=case(stream=1 OR stream=4 OR stream=6, "false", stream=2 OR stream=5 OR stream=7, "true", true(), null()) \
| eval metric_name:service.request.count=case(stream=1, 50, stream=2, 1, stream=3, 0.12, true(), null()) \
| eval metric_name:service.request.ns.median=case(stream=4, 6000000000, stream=5, 100000000, true(), null()) \
| eval metric_name:service.request.ns.p99=case(stream=6, 6000000000, stream=7, 100000000, true(), null()) \
| mcollect index=sim_metrics

