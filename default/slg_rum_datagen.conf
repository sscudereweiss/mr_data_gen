# SLG RUM metrics datagen (override in local/slg_rum_datagen.conf)
[settings]
sf_environment = license_renewal_rum
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York

[observability]
enabled = false
service_name = mr_data_gen_slg_rum
metric_prefix = slg_rum
environment =
otlp_endpoint = http://127.0.0.1:4317
