# EDU DC1 scripted input settings (override in local/edu_dc1_datagen.conf)
[settings]
hosts_lookup = edu_dc1_hosts.csv
os_version = 2.6.32-573.8.1.el6.x86_64
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York
sourcetype = mr_datagen:edu_dc1_metrics
source = mr_data_gen:edu_dc1_metrics

[observability]
enabled = false
service_name = mr_data_gen_edu_dc1
otlp_endpoint = http://127.0.0.1:4317

# Optional spike mode for SA Lab validation (local override)
[spike]
enabled = false
hosts =
metrics =
