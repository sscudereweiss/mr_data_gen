# SLG DC2 scripted input settings (override in local/slg_dc2_datagen.conf)
[settings]
hosts_lookup = slg_dc2_hosts.csv
os_version = 2.6.32-573.8.1.el6.x86_64
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York
sourcetype = mr_datagen:slg_dc2_metrics
source = mr_data_gen:slg_dc2_metrics

[observability]
enabled = false
service_name = mr_data_gen_slg_dc2
metric_prefix = slg_dc2
environment =
otlp_endpoint = http://127.0.0.1:4317

[spike]
enabled = false
hosts =
metrics =
