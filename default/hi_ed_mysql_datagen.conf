# Hi-ED MySQL error log datagen (override in local/hi_ed_mysql_datagen.conf)
[settings]
generator_type = mysql
host_prefix = EDU_DC_1_MySQL_
host_count = 4
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York
demo_minute_start = 41
demo_minute_end = 59

[observability]
enabled = false
service_name = mr_data_gen_hi_ed_mysql
metric_prefix = hi_ed_mysql
environment =
otlp_endpoint = http://127.0.0.1:4317
