# SLG Nagios unstable alert datagen (override in local/slg_nagios_unstable_datagen.conf)
[settings]
generator_type = nagios
host_prefix = SLG_DC_1_MySQL_0
events_per_run = 5
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York
demo_minute_start = 39
demo_minute_end = 59

[observability]
enabled = false
service_name = mr_data_gen_slg_nagios_unstable
metric_prefix = slg_nagios_unstable
environment =
otlp_endpoint = http://127.0.0.1:4317
