# EDU DC1 live metric datagen — classic scripted input (disabled by default).
# Enable in local/inputs.conf: disabled = 0
# See https://help.splunk.com/en/splunk-enterprise/developing-views-and-apps-for-splunk-web/9.4/build-scripted-inputs/setting-up-a-scripted-input
[script://$SPLUNK_HOME/etc/apps/mr_data_gen/bin/edu_dc1_metrics_gen.py]
disabled = 1
interval = 300
index = itsi_im_metrics
sourcetype = mr_datagen:edu_dc1_metrics
source = mr_data_gen:edu_dc1_metrics
