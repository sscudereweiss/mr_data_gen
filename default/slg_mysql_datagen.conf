# SLG MySQL error log datagen (override in local/slg_mysql_datagen.conf)
[settings]
generator_type = mysql
host_prefix = SLG_DC_1_MySQL_
host_count = 4
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York
demo_minute_start = 41
demo_minute_end = 59

[observability]
enabled = false
service_name = mr_data_gen_slg_mysql
metric_prefix = slg_mysql
environment = itsi_demo
output_count_metric = events_emitted
otlp_endpoint = http://127.0.0.1:4317
