# SLG APM metrics datagen (override in local/slg_apm_datagen.conf)
[settings]
sf_service = license_renewal
demo_hours_only = true
demo_start_hour = 8
demo_end_hour = 18
demo_days = mon,tue,wed,thu,fri
demo_timezone = America/New_York

[observability]
enabled = false
service_name = mr_data_gen_slg_apm
metric_prefix = slg_apm
environment =
otlp_endpoint = http://127.0.0.1:4317
